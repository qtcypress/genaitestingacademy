<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — GenAITesting</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="topbar" id="topbar"></nav>

<main class="wrap section" style="display:flex;justify-content:center;padding-top:40px">
  <div class="auth-card">
    <h2 style="margin-top:0">Set a new password</h2>

    <div id="checking">
      <div class="spin"></div>
      <p class="muted" style="text-align:center">Checking your reset link…</p>
    </div>

    <!-- link is valid -->
    <form id="formNew" style="display:none" onsubmit="return doSet(event)">
      <p class="muted" style="margin:0">Signed in as <strong id="whoEmail"></strong>. Choose a new password below.</p>

      <label class="f" for="pw1">New password</label>
      <div class="pw-wrap">
        <input class="f" id="pw1" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
        <button class="pw-toggle" type="button" onclick="togglePw('pw1',this)">SHOW</button>
      </div>

      <label class="f" for="pw2">Confirm new password</label>
      <div class="pw-wrap">
        <input class="f" id="pw2" type="password" autocomplete="new-password" required minlength="8" placeholder="Type it again">
        <button class="pw-toggle" type="button" onclick="togglePw('pw2',this)">SHOW</button>
      </div>

      <button class="btn btn-primary" id="setBtn" type="submit" style="width:100%;margin-top:18px">Save new password</button>
    </form>

    <!-- link missing / expired / already used -->
    <div id="bad" style="display:none">
      <p>This reset link is no longer valid. Links expire after a short time and can only be used once.</p>
      <a class="btn btn-primary" style="width:100%" href="index.html">Request a new link</a>
    </div>

    <div class="auth-msg" id="authMsg" role="status" aria-live="polite"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  renderTopbar("");

  function togglePw(id, btn) {
    const el = document.getElementById(id);
    const show = el.type === "password";
    el.type = show ? "text" : "password";
    btn.textContent = show ? "HIDE" : "SHOW";
  }

  function msg(text, kind = "err") {
    const el = document.getElementById("authMsg");
    if (!text) { el.className = "auth-msg"; el.textContent = ""; return; }
    el.className = "auth-msg show " + kind;
    el.textContent = text;
  }

  function show(which, email) {
    document.getElementById("checking").style.display = "none";
    document.getElementById("formNew").style.display = which === "form" ? "" : "none";
    document.getElementById("bad").style.display     = which === "bad"  ? "" : "none";
    if (email) document.getElementById("whoEmail").textContent = email;
  }

  /* Supabase turns the token in the URL into a short-lived session. Depending on
     timing that either fires PASSWORD_RECOVERY or has already landed by the time
     we look, so we handle both and give up after a moment. */
  let settled = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (settled || !session) return;
    if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION") {
      settled = true;
      show("form", session.user.email);
    }
  });

  setTimeout(async () => {
    if (settled) return;
    const session = await getSession();
    settled = true;
    if (session) show("form", session.user.email);
    else show("bad");
  }, 1500);

  async function doSet(e) {
    e.preventDefault();
    const p1 = document.getElementById("pw1").value;
    const p2 = document.getElementById("pw2").value;
    if (p1 !== p2) { msg("Those two passwords don't match."); return false; }

    msg("");
    const btn = document.getElementById("setBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) throw error;
      msg("Password updated. Taking you to your course…", "ok");
      setTimeout(() => location.href = "app.html", 1200);
    } catch (err) {
      msg(authErrorMessage(err));
      btn.disabled = false; btn.textContent = "Save new password";
    }
    return false;
  }
</script>
</body>
</html>
