<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Certificates — GenAITesting</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Student-only: everything of substance here loads after sign-in, so an
     indexed copy would be an empty shell. noindex, and no canonical, because
     a canonical asks to be indexed under that URL. -->
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GenAITesting">
<meta property="og:title" content="My certificates — GenAITesting">
<meta property="og:description" content="Certificates earned on the GenAI Application Testing programme, each with a publicly verifiable number.">
<meta property="og:url" content="https://genaitesting.online/certificate.html">
<meta property="og:image" content="https://genaitesting.online/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GenAITesting — GenAI Application Testing training and certification">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My certificates — GenAITesting">
<meta name="twitter:description" content="Certificates earned on the GenAI Application Testing programme, each with a publicly verifiable number.">
<meta name="twitter:image" content="https://genaitesting.online/social-card.png">
<link rel="stylesheet" href="app.css">
<style>
  .cert-level{display:inline-block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    font-weight:800;padding:4px 14px;border-radius:999px;margin-bottom:6px}
  .cert-level.basic{background:#E9F3FF;color:#1D63B8}
  .cert-level.advanced{background:var(--amber-tint);color:#B45309}
  .cert-level.expert{background:#FDEBE6;color:var(--orange)}
  .cert-wrap + .cert-wrap{margin-top:28px}
  @media print{
    .cert-wrap{page-break-after:always}
    .cert-wrap:last-child{page-break-after:auto}
  }
</style>
</head>
<body>
<nav class="topbar" id="topbar"></nav>

<main class="wrap section">
  <div id="box"><div class="spin"></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  await requireLogin();
  renderTopbar("cert");
  const box = document.getElementById("box");

  const { data: certs, error } = await sb.from("certificates").select("*").order("issued_at");
  if (error) { box.innerHTML = "<div class='card'>" + escapeHtml(error.message) + "</div>"; return; }

  if (!certs || !certs.length) {
    box.innerHTML = `<div class="card" style="text-align:center;padding:48px 20px">
      <div style="font-size:52px">🎓</div>
      <h2>No certificate yet</h2>
      <p class="muted">Work through the modules, then pass the Basic, Advanced or Expert exam.
        Each level earns its own certificate.</p>
      <a class="btn btn-primary" href="app.html">Go to my course</a></div>`;
    return;
  }

  const ORDER = { basic: 1, advanced: 2, expert: 3 };
  certs.sort((a, b) => (ORDER[a.level] || 9) - (ORDER[b.level] || 9));
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");

  box.innerHTML = `
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <div>
        <h1 style="margin:0;font-size:24px">My Certificates</h1>
        <p class="muted" style="margin:2px 0 0">${certs.length} earned${
          certs.length < 3 ? " · keep going to earn the rest" : " · full set 🎉"}</p>
      </div>
      <button class="btn btn-primary" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>` +
    certs.map((c, i) => `
    <div class="cert-wrap">
      <div class="cert">
        <img class="cert-logo" src="logo.svg" alt="" width="58" height="58">
        <div class="cert-org">${escapeHtml(window.QT_CONFIG.ORG_NAME)} · genaitesting.online</div>
        ${c.level ? `<div class="cert-level ${c.level}">${escapeHtml(c.level)} level</div>` : ""}
        <h1>Certificate of Completion</h1>
        <p class="muted" style="margin:0">This is to certify that</p>
        <div class="cert-name">${escapeHtml(c.full_name)}</div>
        <p class="cert-course">has successfully completed the training program<br>
          <strong style="color:var(--navy)">${escapeHtml(c.course)}</strong><br>
          with an assessment score of <strong>${c.percent ?? "—"}%</strong>.</p>
        <div class="cert-meta">
          <div>Certificate No.<br><span class="cert-no">${escapeHtml(c.cert_number)}</span></div>
          <div>Issued on<br><strong>${fmtDate(c.issued_at)}</strong></div>
          <div>Verify at<br><strong>${base}verify.html</strong></div>
        </div>
      </div>
      <div class="no-print" style="text-align:center;margin-top:10px">
        <button class="btn btn-ghost btn-sm" data-n="${escapeHtml(c.cert_number)}">🔗 Copy verification link</button>
      </div>
    </div>`).join("");

  box.querySelectorAll("button[data-n]").forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(base + "verify.html?q=" + encodeURIComponent(b.dataset.n))
      .then(() => showToast("Verification link copied!"));
  });
})();
</script>
</body>
</html>
