<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material — GenAITesting</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="app.css">
<style>
  .viewer-frame{width:100%;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}

  /* ---- immersive mode, for HTML lessons ----
     A lesson is a whole page in its own right — it has its own header, its own
     navigation and its own dark theme. Framing it inside a 1080px column with a
     second title above it wasted roughly a third of the screen and made the
     lesson look like a preview of itself. In immersive mode the page chrome
     shrinks to one slim bar and the lesson gets everything below it. Only the
     `html` kind opts in; PDFs, images and spreadsheets are unchanged. */
  body.immersive main.wrap{max-width:none;padding:0;margin:0}
  body.immersive .section{margin:0}
  body.immersive .viewer-frame{
    height:calc(100vh - 96px);min-height:360px;
    border:none;border-radius:0;border-top:1px solid var(--line)}
  .slimbar{
    display:flex;align-items:center;gap:12px;flex-wrap:nowrap;
    padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
  .slimbar .t{min-width:0;flex:1}
  .slimbar h1{
    margin:0;font-size:15px;line-height:1.25;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .slimbar .back{
    color:var(--slate);text-decoration:none;font-size:13px;font-weight:600;
    white-space:nowrap;flex-shrink:0}
  .slimbar .back:hover{color:var(--navy)}
  .slimbar .acts{display:flex;gap:8px;flex-shrink:0}
  /* The lesson is dark; a white letterbox around it in full screen looks broken. */
  .viewer-frame:fullscreen{height:100vh;width:100vw;border:none;background:#0B0C3D}
  /* Print-to-PDF is downloading by another name, so Ctrl+P gets a notice rather than
     a clean copy of the lesson. This is a deterrent, not protection — anything a
     browser can display can be captured. It exists so nobody does it by accident. */
  @media print{
    .viewer-frame,.viewer-img{display:none!important}
    #stage::after{content:"Course content is for reading on genaitesting.online and is not printable.";
      display:block;padding:40px;text-align:center;font-size:15px;color:#111827}
  }
  @media (max-width:640px){
    .slimbar{padding:8px 10px;gap:8px}
    .slimbar h1{font-size:13.5px}
    .slimbar .back span{display:none}
    body.immersive .viewer-frame{height:calc(100vh - 88px)}
  }
  .viewer-img{display:block;margin:0 auto;max-height:calc(100vh - 220px);border-radius:var(--radius);box-shadow:var(--shadow)}
  .sheet-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
</style>
</head>
<body>
<nav class="topbar" id="topbar"></nav>

<main class="wrap section">
  <!-- the tall header, used for everything that is not an HTML lesson -->
  <div id="fullHeader" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <div>
      <a href="app.html" class="muted" style="text-decoration:none">← Back to materials</a>
      <h1 id="title" style="margin:4px 0 0;font-size:clamp(19px,3.4vw,26px)">Loading…</h1>
      <p class="muted" id="desc" style="margin:2px 0 0"></p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">
      <button class="btn btn-primary btn-sm" id="doneBtn">✓ Mark as completed</button>
    </div>
  </div>

  <!-- one line of chrome, used for HTML lessons so the lesson gets the screen -->
  <div class="slimbar no-print" id="slimBar" style="display:none">
    <a href="app.html" class="back">←<span> Back</span></a>
    <div class="t"><h1 id="slimTitle"></h1></div>
    <div class="acts">
      <button class="btn btn-ghost btn-sm" id="fsBtn" title="Full screen (Esc to leave)">⛶ Full screen</button>
      <button class="btn btn-primary btn-sm" id="slimDone">✓ Completed</button>
    </div>
  </div>

  <div id="stage"><div class="spin"></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  await requireLogin();
  renderTopbar("app");

  const id = new URLSearchParams(location.search).get("id");
  const stage = document.getElementById("stage");
  if (!id) { stage.innerHTML = "<div class='card'>No material selected.</div>"; return; }

  const { data: m, error } = await sb.from("materials").select("*").eq("id", id).maybeSingle();
  if (!m) {
    /* Row-level security hides paid materials, so "no row" usually means locked
       rather than missing. Check access to give the right message. */
    let locked = false;
    try {
      const { data: acc } = await sb.rpc("my_access");
      const a0 = (acc || [])[0];
      locked = !(a0 && (a0.has_access || a0.is_admin));
    } catch (e) { /* fall through to generic message */ }
    stage.innerHTML = locked
      ? `<div class="card" style="text-align:center;padding:44px 20px">
           <div style="font-size:44px">\u{1F512}</div>
           <h2 style="margin:8px 0">This material is part of the paid course</h2>
           <p class="muted">Module 1 is free to preview. Unlock every module and all three
             certification exams from \u20b9499.</p>
           <a class="btn btn-primary" href="pricing.html">See plans</a>
           <a class="btn btn-ghost" href="app.html">Back to my course</a></div>`
      : `<div class="card">Material not found.${error ? " " + escapeHtml(error.message) : ""}</div>`;
    document.getElementById("title").textContent = locked ? "Locked" : "Not found";
    document.querySelectorAll(".no-print").forEach(el => el.style.display = "none");
    return;
  }

  document.title = m.title + " — GenAITesting";
  document.getElementById("title").textContent = m.title;
  document.getElementById("desc").textContent = m.description || "";

  let url;
  try { url = await signedUrl(m.storage_path, 3600); }
  catch (e) { stage.innerHTML = "<div class='card'>Could not open file: " + escapeHtml(e.message) + "</div>"; return; }

  /* Course content is read in the browser and is not offered for download. The
     signed URL is still needed to render it, but nothing links to it as a file. */

  /* ---- immersive mode for HTML lessons ----
     A lesson is already a full page: its own header, its own tab rail, its own
     theme. Nesting it under a second title inside a 1080px column spent about a
     third of the screen restating what the lesson says better itself. So for the
     `html` kind the chrome collapses to one line and the lesson takes the rest,
     with a full-screen button for when even that line is in the way. */
  const immersive = m.kind === "html";
  if (immersive) {
    document.body.classList.add("immersive");
    document.getElementById("fullHeader").style.display = "none";
    const bar = document.getElementById("slimBar");
    bar.style.display = "";
    document.getElementById("slimTitle").textContent = m.title;
    document.getElementById("slimDone").onclick = () => document.getElementById("doneBtn").click();

    const fsBtn = document.getElementById("fsBtn");
    fsBtn.onclick = () => {
      const frame = document.querySelector(".viewer-frame");
      if (!frame) return;
      // Safari still only has the webkit-prefixed call.
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
        // If the browser refuses, say so rather than leaving a dead button.
        Promise.resolve(req && req.call(frame)).catch(() =>
          showToast("This browser would not go full screen", true));
      }
    };
    const syncFs = () => {
      const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      fsBtn.textContent = on ? "⤢ Exit full screen" : "⛶ Full screen";
    };
    document.addEventListener("fullscreenchange", syncFs);
    document.addEventListener("webkitfullscreenchange", syncFs);
  }

  /* record that the student opened it */
  markProgress(m.id, "viewed");
  document.getElementById("doneBtn").onclick = async () => {
    await markProgress(m.id, "completed");
    showToast("Marked as completed 🎉");
    document.getElementById("doneBtn").textContent = "✓ Completed";
    document.getElementById("doneBtn").disabled = true;
  };

  /* ---- render by kind ----
     NOTE: Supabase Storage deliberately serves stored HTML/SVG as text/plain
     (anti-XSS: it won't serve markup from its own domain). Loading the signed URL
     straight into an iframe therefore shows raw source. So for those types we fetch
     the bytes and re-serve them locally as a blob with the correct MIME type,
     which also restores UTF-8 so emoji render properly. */
  const asBlobUrl = async (mime) => {
    const buf = await (await fetch(url)).arrayBuffer();
    const objUrl = URL.createObjectURL(new Blob([buf], { type: mime }));
    window.addEventListener("pagehide", () => URL.revokeObjectURL(objUrl));
    return objUrl;
  };
  /* No "download instead" escape hatch: content stays in the browser. A student who
     hits this needs a reload or a trainer, not a copy of the file. */
  const failCard = (e) => `<div class="card"><h3>Couldn't display this file</h3>
      <p class="muted">${escapeHtml(e.message || String(e))}</p>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary btn-sm" onclick="location.reload()">Try again</button>
        <a class="btn btn-ghost btn-sm" href="app.html">Back to my course</a></div>
      <p class="muted" style="margin-top:10px;font-size:12.5px">If it keeps failing, tell your
        trainer which module this is and they will look into it.</p></div>`;
  const isSvg = /\.svg$/i.test(m.file_name);

  if (m.kind === "html") {
    stage.innerHTML = `<div class="spin"></div>`;
    try {
      /* sandbox WITHOUT allow-same-origin: the lesson gets an opaque origin, so its
         scripts/animations still run but it cannot read this page or the student's session. */
      stage.innerHTML = `<iframe class="viewer-frame" src="${await asBlobUrl("text/html;charset=utf-8")}"
        title="${escapeHtml(m.title)}" allowfullscreen
        sandbox="allow-scripts allow-popups allow-forms"></iframe>`;
    } catch (e) { stage.innerHTML = failCard(e); }
  }
  else if (m.kind === "pdf") {
    stage.innerHTML = `<div class="spin"></div>`;
    try {
      stage.innerHTML = `<iframe class="viewer-frame" src="${await asBlobUrl("application/pdf")}" title="${escapeHtml(m.title)}"></iframe>`;
    } catch (e) { stage.innerHTML = failCard(e); }
  }
  else if (m.kind === "image" || m.kind === "gif") {
    if (isSvg) {
      stage.innerHTML = `<div class="spin"></div>`;
      try {
        stage.innerHTML = `<img class="viewer-img" src="${await asBlobUrl("image/svg+xml")}" alt="${escapeHtml(m.title)}">`;
      } catch (e) { stage.innerHTML = failCard(e); }
    } else {
      stage.innerHTML = `<img class="viewer-img" src="${url}" alt="${escapeHtml(m.title)}">`;
    }
  }
  else if (m.kind === "pptx" || m.kind === "docx") {
    const office = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(url);
    stage.innerHTML = `
      <iframe class="viewer-frame" src="${office}" title="${escapeHtml(m.title)}"></iframe>
      <p class="muted" style="margin-top:8px">Preview powered by Microsoft Office online viewer.
      If it doesn't load, reload the page — the preview link is short-lived.</p>`;
  }
  else if (m.kind === "xlsx") {
    stage.innerHTML = `<div class="spin"></div>`;
    /* Excel → interactive tables, rendered client-side with SheetJS */
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = async () => {
      try {
        const buf = await (await fetch(url)).arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        let html = `<div class="sheet-tabs no-print">` + wb.SheetNames.map((n, i) =>
          `<button class="btn btn-sm ${i === 0 ? "btn-navy" : "btn-ghost"}" data-i="${i}">${escapeHtml(n)}</button>`).join("") + `</div>`;
        html += wb.SheetNames.map((n, i) => {
          const tbl = XLSX.utils.sheet_to_html(wb.Sheets[n], { id: "sheet" + i });
          return `<div class="table-wrap sheet-pane" id="pane${i}" style="${i ? "display:none" : ""}">${tbl}</div>`;
        }).join("");
        stage.innerHTML = html;
        stage.querySelectorAll("table").forEach(t => t.classList.add("qt"));
        stage.querySelectorAll(".sheet-tabs button").forEach(b => b.onclick = () => {
          stage.querySelectorAll(".sheet-pane").forEach(p => (p.style.display = "none"));
          stage.querySelectorAll(".sheet-tabs button").forEach(x => x.className = "btn btn-sm btn-ghost");
          b.className = "btn btn-sm btn-navy";
          document.getElementById("pane" + b.dataset.i).style.display = "";
        });
      } catch (e) { stage.innerHTML = "<div class='card'>Could not parse spreadsheet: " + escapeHtml(e.message) + "</div>"; }
    };
    document.body.appendChild(s);
  }
  else {
    /* This kind cannot be shown in a browser and is no longer offered as a file, so
       the honest thing is to say so rather than present a dead end as a feature. */
    stage.innerHTML = `<div class="card" style="text-align:center;padding:48px">
      <h3>${escapeHtml(m.title)}</h3>
      <p class="muted">This material is in a format the browser cannot display, and course
        content is not available for download.</p>
      <p class="muted">Ask your trainer to re-upload it as a PDF or an HTML lesson.</p>
      <a class="btn btn-ghost btn-sm" style="margin-top:10px" href="app.html">Back to my course</a></div>`;
  }
})();
</script>
</body>
</html>
