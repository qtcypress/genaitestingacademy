<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material — QT GenAI Testing Academy</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<style>
  .viewer-frame{width:100%;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
  .viewer-img{display:block;margin:0 auto;max-height:calc(100vh - 220px);border-radius:var(--radius);box-shadow:var(--shadow)}
  .sheet-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
</style>
</head>
<body>
<nav class="topbar" id="topbar"></nav>

<main class="wrap section">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <div>
      <a href="app.html" class="muted" style="text-decoration:none">← Back to materials</a>
      <h1 id="title" style="margin:4px 0 0;font-size:clamp(19px,3.4vw,26px)">Loading…</h1>
      <p class="muted" id="desc" style="margin:2px 0 0"></p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">
      <a class="btn btn-ghost btn-sm" id="downloadBtn" href="#" download>⬇ Download</a>
      <button class="btn btn-primary btn-sm" id="doneBtn">✓ Mark as completed</button>
    </div>
  </div>
  <div id="stage"><div class="spin"></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  await requireLogin();
  renderTopbar("app");

  const id = new URLSearchParams(location.search).get("id");
  const stage = document.getElementById("stage");
  if (!id) { stage.innerHTML = "<div class='card'>No material selected.</div>"; return; }

  const { data: m, error } = await sb.from("materials").select("*").eq("id", id).maybeSingle();
  if (!m) {
    /* Row-level security hides paid materials, so "no row" usually means locked
       rather than missing. Check access to give the right message. */
    let locked = false;
    try {
      const { data: acc } = await sb.rpc("my_access");
      const a0 = (acc || [])[0];
      locked = !(a0 && (a0.has_access || a0.is_admin));
    } catch (e) { /* fall through to generic message */ }
    stage.innerHTML = locked
      ? `<div class="card" style="text-align:center;padding:44px 20px">
           <div style="font-size:44px">\u{1F512}</div>
           <h2 style="margin:8px 0">This material is part of the paid course</h2>
           <p class="muted">Module 1 is free to preview. Unlock every module and all three
             certification exams from \u20b9499.</p>
           <a class="btn btn-primary" href="pricing.html">See plans</a>
           <a class="btn btn-ghost" href="app.html">Back to my course</a></div>`
      : `<div class="card">Material not found.${error ? " " + escapeHtml(error.message) : ""}</div>`;
    document.getElementById("title").textContent = locked ? "Locked" : "Not found";
    document.querySelector(".no-print").style.display = "none";
    return;
  }

  document.title = m.title + " — QT GenAI Testing Academy";
  document.getElementById("title").textContent = m.title;
  document.getElementById("desc").textContent = m.description || "";

  let url;
  try { url = await signedUrl(m.storage_path, 3600); }
  catch (e) { stage.innerHTML = "<div class='card'>Could not open file: " + escapeHtml(e.message) + "</div>"; return; }

  document.getElementById("downloadBtn").href = url;
  document.getElementById("downloadBtn").setAttribute("download", m.file_name);

  /* record that the student opened it */
  markProgress(m.id, "viewed");
  document.getElementById("doneBtn").onclick = async () => {
    await markProgress(m.id, "completed");
    showToast("Marked as completed 🎉");
    document.getElementById("doneBtn").textContent = "✓ Completed";
    document.getElementById("doneBtn").disabled = true;
  };

  /* ---- render by kind ----
     NOTE: Supabase Storage deliberately serves stored HTML/SVG as text/plain
     (anti-XSS: it won't serve markup from its own domain). Loading the signed URL
     straight into an iframe therefore shows raw source. So for those types we fetch
     the bytes and re-serve them locally as a blob with the correct MIME type,
     which also restores UTF-8 so emoji render properly. */
  const asBlobUrl = async (mime) => {
    const buf = await (await fetch(url)).arrayBuffer();
    const objUrl = URL.createObjectURL(new Blob([buf], { type: mime }));
    window.addEventListener("pagehide", () => URL.revokeObjectURL(objUrl));
    return objUrl;
  };
  const failCard = (e) => `<div class="card"><h3>Couldn't display this file</h3>
      <p class="muted">${escapeHtml(e.message || String(e))}</p>
      <a class="btn btn-primary btn-sm" href="${url}" download="${escapeHtml(m.file_name)}">⬇ Download instead</a></div>`;
  const isSvg = /\.svg$/i.test(m.file_name);

  if (m.kind === "html") {
    stage.innerHTML = `<div class="spin"></div>`;
    try {
      /* sandbox WITHOUT allow-same-origin: the lesson gets an opaque origin, so its
         scripts/animations still run but it cannot read this page or the student's session. */
      stage.innerHTML = `<iframe class="viewer-frame" src="${await asBlobUrl("text/html;charset=utf-8")}"
        title="${escapeHtml(m.title)}" sandbox="allow-scripts allow-popups allow-forms"></iframe>`;
    } catch (e) { stage.innerHTML = failCard(e); }
  }
  else if (m.kind === "pdf") {
    stage.innerHTML = `<div class="spin"></div>`;
    try {
      stage.innerHTML = `<iframe class="viewer-frame" src="${await asBlobUrl("application/pdf")}" title="${escapeHtml(m.title)}"></iframe>`;
    } catch (e) { stage.innerHTML = failCard(e); }
  }
  else if (m.kind === "image" || m.kind === "gif") {
    if (isSvg) {
      stage.innerHTML = `<div class="spin"></div>`;
      try {
        stage.innerHTML = `<img class="viewer-img" src="${await asBlobUrl("image/svg+xml")}" alt="${escapeHtml(m.title)}">`;
      } catch (e) { stage.innerHTML = failCard(e); }
    } else {
      stage.innerHTML = `<img class="viewer-img" src="${url}" alt="${escapeHtml(m.title)}">`;
    }
  }
  else if (m.kind === "pptx" || m.kind === "docx") {
    const office = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(url);
    stage.innerHTML = `
      <iframe class="viewer-frame" src="${office}" title="${escapeHtml(m.title)}"></iframe>
      <p class="muted" style="margin-top:8px">Preview powered by Microsoft Office online viewer.
      If it doesn't load, use <strong>⬇ Download</strong> above to open the file locally.</p>`;
  }
  else if (m.kind === "xlsx") {
    stage.innerHTML = `<div class="spin"></div>`;
    /* Excel → interactive tables, rendered client-side with SheetJS */
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = async () => {
      try {
        const buf = await (await fetch(url)).arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        let html = `<div class="sheet-tabs no-print">` + wb.SheetNames.map((n, i) =>
          `<button class="btn btn-sm ${i === 0 ? "btn-navy" : "btn-ghost"}" data-i="${i}">${escapeHtml(n)}</button>`).join("") + `</div>`;
        html += wb.SheetNames.map((n, i) => {
          const tbl = XLSX.utils.sheet_to_html(wb.Sheets[n], { id: "sheet" + i });
          return `<div class="table-wrap sheet-pane" id="pane${i}" style="${i ? "display:none" : ""}">${tbl}</div>`;
        }).join("");
        stage.innerHTML = html;
        stage.querySelectorAll("table").forEach(t => t.classList.add("qt"));
        stage.querySelectorAll(".sheet-tabs button").forEach(b => b.onclick = () => {
          stage.querySelectorAll(".sheet-pane").forEach(p => (p.style.display = "none"));
          stage.querySelectorAll(".sheet-tabs button").forEach(x => x.className = "btn btn-sm btn-ghost");
          b.className = "btn btn-sm btn-navy";
          document.getElementById("pane" + b.dataset.i).style.display = "";
        });
      } catch (e) { stage.innerHTML = "<div class='card'>Could not parse spreadsheet: " + escapeHtml(e.message) + "</div>"; }
    };
    document.body.appendChild(s);
  }
  else {
    stage.innerHTML = `<div class="card" style="text-align:center;padding:48px">
      <h3>${escapeHtml(m.file_name)}</h3>
      <p class="muted">This file type opens outside the browser.</p>
      <a class="btn btn-primary" href="${url}" download="${escapeHtml(m.file_name)}">⬇ Download file</a></div>`;
  }
})();
</script>
</body>
</html>
